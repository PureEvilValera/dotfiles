# More option see https://github.com/DreamMaoMao/mango/wiki/

# monitor rules
#monitorrule=eDP-1,0.55,1,master,0,1,2560,0,1920,1080,120

# scroller layout setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# master-stack layout setting
new_is_master=0
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# overview setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
cursor_theme=Adwaita
cursor_hide_timeout=0
cursor_size=24

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
#tagrule=id:1,layout_name:tile
#tagrule=id:2,layout_name:tile
#tagrule=id:3,layout_name:tile
#tagrule=id:4,layout_name:tile
#tagrule=id:5,layout_name:tile
#tagrule=id:6,layout_name:tile
#tagrule=id:7,layout_name:tile
#tagrule=id:8,layout_name:tile
#tagrule=id:9,layout_name:tile
tag_rule=id:*,layout_name:tile
tag_num=9

# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# import other parts of config
source=~/.config/mango/bind.conf
source=~/.config/mango/input.conf
source=~/.config/mango/visual.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/env.conf

# run autostart
exec_once=~/.config/mango/autostart.sh
